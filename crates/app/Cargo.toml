[package]
name = "cockpit"
description = "Cockpit: a native IDE with an embedded Chromium browser and the Codex agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "cockpit"

[[bin]]
name = "cockpit"
path = "src/main.rs"

# Chromium's renderer/GPU/utility processes. `cargo xtask bundle` copies it
# into the `Cockpit Helper*.app` bundles.
[[bin]]
name = "cockpit-helper"
path = "src/bin/helper.rs"

[features]
# Type-check the macOS build from another host (see cockpit-browser).
cef-typecheck = ["cockpit-browser/cef-typecheck"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
cockpit-agents.workspace = true
cockpit-browser.workspace = true
cockpit-common.workspace = true
cockpit-persistence.workspace = true
cockpit-ui.workspace = true
gpui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

# Compile Metal shaders at run time, so building does not require the full
# Xcode (the Command Line Tools have no `metal` compiler).
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["runtime_shaders"] }
