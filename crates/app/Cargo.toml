[package]
name = "hangar"
description = "Hangar: a native IDE with an embedded Chromium browser and the Codex agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "hangar"

[[bin]]
name = "hangar"
path = "src/main.rs"

# Chromium's renderer/GPU/utility processes. `cargo xtask bundle` copies it
# into the `Hangar Helper*.app` bundles.
[[bin]]
name = "hangar-helper"
path = "src/bin/helper.rs"

[features]
default = ["runtime-shaders"]
# Type-check the macOS build from another host (see cockpit-browser).
cef-typecheck = ["cockpit-browser/cef-typecheck"]
# Compile GPUI's Metal shaders when the app starts, so building does not
# require the Metal compiler (the Command Line Tools have none). macOS caches
# the result, but the first launch after an install or OS update spends
# ~300 ms on it. `cargo xtask bundle --release` turns this off, shipping
# precompiled shaders, whenever `xcrun` can find the compiler.
runtime-shaders = ["gpui/runtime_shaders"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
cockpit-agents.workspace = true
cockpit-browser.workspace = true
cockpit-common.workspace = true
cockpit-persistence.workspace = true
cockpit-ui.workspace = true
gpui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
